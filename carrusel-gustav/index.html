<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Carrusel: Gustav Breitler en Maestros</title>
<style>
  @font-face { font-family: "Schola SdM"; font-weight: 400; font-style: normal; src: url("../fonts/schola-regular.woff2") format("woff2"); }
  @font-face { font-family: "Schola SdM"; font-weight: 400; font-style: italic; src: url("../fonts/schola-italic.woff2") format("woff2"); }
  body { margin: 0; padding: 16px; background: #222; color: #eee; font: 16px/1.4 Georgia, serif; }
  #laminas { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; }
  canvas { width: 270px; height: 338px; display: block; }
  a { color: #b7bfb0; }
</style>
</head>
<body>
<p id="estado">Generando…</p>
<div id="laminas"></div>
<script src="plantilla.js"></script>
<script>
const { M, W, HUESO, SUAVE } = SDM;
const MES = 'Noviembre 2026';
const laminas = [
  // 1. Portada
  async c => { SDM.fondo(c); SDM.cabecera(c, 'Maestros · Soy de Madera');
    const img = await SDM.cargarImagen('../img/gustav-breitler-cofre-obsesion.jpg');
    SDM.lamina(c, img, 240, 190, 600, 600);
    SDM.parrafo(c, 'Cofre «Obsesión» · Foto: Gustav Breitler', 240, 852, 744, 36, SUAVE);
    SDM.texto(c, 'Gustav Breitler', M, 1040, 104, HUESO);
    SDM.texto(c, 'En el hacer viene el saber', M, 1120, 54, HUESO, 'italic');
    SDM.pie(c, MES); },
  // 2. Atreverse
  async c => { SDM.fondo(c);
    const img = await SDM.cargarImagen('../img/gustav-breitler-cajonera-marqueteria.jpg');
    SDM.lamina(c, img, 240, 150, 600, 600);
    SDM.parrafo(c, 'Primera marquetería · Foto: Gustav Breitler', 240, 812, 744, 36, SUAVE);
    SDM.parrafo(c, '«Que no tenga miedo, y si lo tiene, no importa: que igual se atreva.»', M, 990, W - 2 * M, 64, HUESO);
    SDM.pie(c, MES); },
  // 3. Cada objeto
  async c => { SDM.fondo(c);
    const img = await SDM.cargarImagen('../img/gustav-breitler-cajas-kasane-rindo.jpg');
    SDM.lamina(c, img, 300, 140, 480, 600);
    SDM.parrafo(c, 'Cajitas «Kasane Rindo» · Cuadro de video: Gustav Breitler', 300, 802, 684, 36, SUAVE);
    SDM.parrafo(c, '«Cada objeto es un ejercicio en sí.»', M, 1040, W - 2 * M, 64, HUESO);
    SDM.pie(c, MES); },
  // 4. Nadie es un genio
  async c => { SDM.fondo(c);
    const img = await SDM.cargarImagen('../img/gustav-breitler-caja-piure.jpg');
    SDM.lamina(c, img, 240, 150, 600, 600);
    SDM.parrafo(c, 'Caja de corte «Piure» · Foto: Gustav Breitler', 240, 812, 744, 36, SUAVE);
    SDM.parrafo(c, '«En esto nadie, pero nadie, es un genio en sus comienzos.»', M, 990, W - 2 * M, 64, HUESO);
    SDM.pie(c, MES); },
  // 5. Cierre
  c => { SDM.fondo(c); SDM.cabecera(c, 'Maestros · Soy de Madera');
    const y = SDM.parrafo(c, 'La entrevista completa a Gustav Breitler, en soydemadera.com', M, 520, W - 2 * M, 72, HUESO);
    SDM.filete(c, y + 80);
    SDM.texto(c, 'Su trabajo: @baobab_taller', M, y + 190, 44, SUAVE);
    SDM.pie(c, MES); },
];
SDM.generar(laminas, 'gustav').catch(e => { document.getElementById('estado').textContent = 'Error: ' + e; });
</script>
</body>
</html>
