<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Enviar láminas</title></head>
<body><p id="m">Enviando…</p>
<script>
(async () => {
  const m = document.getElementById('m');
  try {
    if (!window.opener) { m.textContent = 'Sin ventana de origen.'; return; }
    const q = new URLSearchParams(location.search);
    const set = q.get('set') === 'palabra5' ? 'palabra5' : 'lucas';
    const n = set === 'palabra5' ? 5 : 3;
    const files = [];
    for (let i = 1; i <= n; i++) {
      const src = set === 'palabra5' ? 'palabra5-' + i + '.jpg' : 'lamina-' + i + '.jpg';
      const r = await fetch(src, { cache: 'no-store' });
      files.push({ name: set + '-lamina-' + i + '.jpg', buf: await r.arrayBuffer() });
    }
    window.opener.postMessage({ tipo: 'laminas-sdm', files }, 'https://business.facebook.com');
    m.textContent = 'Listo: ' + files.length + ' láminas enviadas.';
    setTimeout(() => window.close(), 1500);
  } catch (e) { m.textContent = 'Error: ' + e.message; }
})();
</script></body></html>
